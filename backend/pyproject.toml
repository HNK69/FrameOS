[project]
name = "frameops-api"
version = "0.1.0"
description = "FRAMEOPS adaptive client intelligence API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "pydantic-settings>=2.5,<3",
  "httpx>=0.27,<1",
  "psycopg[binary]>=3.2,<4",
  "websockets>=13,<16",
  "PyJWT>=2.9,<3",
  "pwdlib[argon2]>=0.2,<1",
  "python-multipart>=0.0.12,<1",
  "email-validator>=2.2,<3",
  "cohere>=7.3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.7,<1", "httpx>=0.27,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
